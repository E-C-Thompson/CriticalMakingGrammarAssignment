<script>
    var obj = {
        "origin": ["#sentence# #action#"],
        "sentence": [
            "The #part# is #status#.", 
            "Warning: the #part# has #status#.", 
            "In the heat of the repair, the #part# is #status#."
        ],
        "part": ["fork", "titanium bolt", "hydraulic line", "bottom bracket", "derailleur hanger", "spoke nipple"],
        "status": [
            "fractured under load", 
            "stripped by the wrong wrench", 
            "seized from salt and grit", 
            "glowing with friction", 
            "deforming into useless metal"
        ],
        "action": [
            "Apply #liquid# and pray.", 
            "Walk away from the repair stand.", 
            "Take a long walk home.", 
            "Consult the manual you lost in 2014.", 
            "Acknowledge the #failure#.",
            "Check if Calvin Jones has a video about this."
        ],
        "liquid": ["heavy grease", "penetrating oil", "degreaser", "isopropyl alcohol"],
        "failure": ["mechanical failure", "human error", "material fatigue"]
    };
    function generateString(template) {
        let placeholder = template.match(/#([^#]+)#/);
        while (placeholder) {
            let [fullMatch, key] = placeholder;
            let choices = obj[key];
            if (!choices) return template; 
            let choice = choices[Math.floor(Math.random() * choices.length)];
            template = template.replace(fullMatch, generateString(choice));
            placeholder = template.match(/#([^#]+)#/);
        }
        return template;
    }
    function displayString() {
        var randomIndex = Math.floor(Math.random() * obj.origin.length);
        document.getElementById('text-container').innerHTML = generateString(obj.origin[randomIndex]);
    }
    displayString();
</script>
